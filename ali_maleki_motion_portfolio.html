<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Ali Maleki — IT Specialist and Computer Engineering portfolio.">
<title>Ali Maleki | IT & Cybersecurity</title>
<style>
:root{--cyan:#00dfff;--blue:#087cff;--ink:#eaf7ff;--muted:#abc0d3;--panel:#071a2d}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#020916;color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif;overflow-x:hidden}
.hero{position:relative;width:100%;min-height:100vh;min-height:100svh;display:flex;align-items:flex-start;justify-content:center;background:#020916;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.hero:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(1,8,18,.16),transparent 25%)}
.hotspot{position:absolute;z-index:2;display:block;border-radius:10px;cursor:pointer;outline-offset:3px}
.hotspot:focus-visible{outline:2px solid var(--cyan);background:rgba(0,220,255,.12)}
/* Interactive hit areas align with the menu and buttons in the supplied hero artwork. */
.home{left:28.5%;top:3%;width:5%;height:6.5%}
.about{left:34.5%;top:3%;width:5.3%;height:6.5%}
.experience{left:40.2%;top:3%;width:7.5%;height:6.5%}
.education{left:47.8%;top:3%;width:6.5%;height:6.5%}
.skills{left:55%;top:3%;width:4.5%;height:6.5%}
.projects{left:60%;top:3%;width:6%;height:6.5%}
.contact{left:66.4%;top:3%;width:6.2%;height:6.5%}
.linkedin{left:84.1%;top:3.2%;width:2.8%;height:5.5%}
.emailtop{left:90.6%;top:3.2%;width:2.8%;height:5.5%}
.whatsapp{left:94.1%;top:3.1%;width:3.7%;height:5.8%;display:grid;place-items:center;border:1px solid rgba(0,223,255,.75);background:rgba(2,17,34,.94);box-shadow:0 0 16px rgba(0,217,255,.22);border-radius:50%}
.whatsapp svg{width:67%;height:67%;fill:#20d66b;filter:drop-shadow(0 0 4px rgba(32,214,107,.25))}
.whatsapp:hover{transform:scale(1.08);box-shadow:0 0 22px rgba(32,214,107,.45)}
.cta{left:4.7%;top:62.4%;width:16%;height:6.5%}
.emailbottom{left:85%;top:93.1%;width:14%;height:4.5%}
.locationbottom{left:72%;top:93.1%;width:12%;height:4.5%}
/* The section opens as a separate overlay page above the dimmed home screen. */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:rgba(0,5,14,.76);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);opacity:0;visibility:hidden;transition:opacity .32s ease,visibility .32s ease}
.overlay.open{opacity:1;visibility:visible}
.page{position:relative;width:min(980px,100%);max-height:min(88vh,900px);overflow:auto;border:1px solid rgba(0,220,255,.32);border-radius:22px;background:linear-gradient(145deg,rgba(8,30,52,.98),rgba(3,13,28,.98));box-shadow:0 30px 100px rgba(0,0,0,.65),0 0 45px rgba(0,190,255,.10);transform:translateY(24px) scale(.985);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.overlay.open .page{transform:translateY(0) scale(1)}
.page-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:21px 27px;border-bottom:1px solid rgba(0,220,255,.16);background:rgba(5,20,37,.94);backdrop-filter:blur(14px)}
.brand{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);font-weight:800}
.close{width:42px;height:42px;border:1px solid rgba(0,220,255,.35);border-radius:50%;background:rgba(0,220,255,.07);color:#fff;font-size:25px;line-height:1;cursor:pointer;transition:.2s}
.close:hover{background:var(--cyan);color:#00111b;transform:rotate(90deg)}
.page-content{padding:clamp(24px,5vw,52px)}
.kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);font-weight:800}
h1{font-size:clamp(30px,5vw,48px);line-height:1.1;letter-spacing:-.045em;margin:12px 0 24px}
h2{font-size:19px;margin:0 0 10px}
p{font-size:14px;line-height:1.85;color:var(--muted);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.card{padding:22px;border:1px solid rgba(0,220,255,.17);border-radius:13px;background:linear-gradient(145deg,rgba(12,43,69,.72),rgba(4,19,35,.82))}
.card h2{color:#f1faff}.taglist{display:flex;flex-wrap:wrap;gap:9px}
.tag{padding:8px 11px;border:1px solid rgba(0,220,255,.22);border-radius:7px;background:rgba(0,220,255,.055);font-size:12px;color:#d6f8ff}
.entry{display:grid;grid-template-columns:110px 1fr;gap:20px;padding:20px 0;border-bottom:1px solid rgba(0,220,255,.13)}
.entry:last-child{border:0}.duration{font-size:12px;font-weight:800;color:var(--cyan);letter-spacing:.08em}
.link{display:inline-block;margin-top:8px;color:var(--cyan);font-size:13px;font-weight:700;text-decoration:none}.link:hover{text-decoration:underline}
.footer-note{font-size:11px;color:#718ba5;margin-top:28px}
@media(max-width:700px){
 .hero{min-height:100svh}.hero img{object-fit:cover;object-position:52% top}
 .overlay{padding:10px}.page{max-height:94vh;border-radius:16px}.page-head{padding:15px 18px}.page-content{padding:24px 18px}.grid{grid-template-columns:1fr}.entry{grid-template-columns:1fr;gap:6px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* Motion layer: subtle cyber atmosphere, without changing the original layout */
body::before{
 content:"";position:fixed;inset:-35%;z-index:0;pointer-events:none;
 background:
  radial-gradient(ellipse at 18% 25%,rgba(0,190,255,.13),transparent 34%),
  radial-gradient(ellipse at 82% 72%,rgba(0,95,255,.12),transparent 38%);
 filter:blur(28px);animation:ambientDrift 18s ease-in-out infinite alternate;
}
.hero{isolation:isolate}
.hero img{transform-origin:center;animation:heroFloat 24s ease-in-out infinite alternate}
.hero::before{
 content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.22;
 background:repeating-linear-gradient(to bottom,transparent 0px,transparent 3px,rgba(0,220,255,.12) 4px,transparent 5px);
 animation:scanMove 13s linear infinite;
}
.hotspot{transition:background .25s ease,box-shadow .25s ease,transform .25s ease}
.hotspot:hover{background:rgba(0,220,255,.08);box-shadow:0 0 24px rgba(0,220,255,.16);transform:translateY(-2px)}
.whatsapp{animation:softPulse 3.2s ease-in-out infinite}
.overlay{transition:opacity .42s ease,visibility .42s ease}
.page{transform:translateY(34px) scale(.975);transition:transform .48s cubic-bezier(.16,1,.3,1),box-shadow .4s ease}
.overlay.open .page{box-shadow:0 30px 100px rgba(0,0,0,.65),0 0 55px rgba(0,190,255,.16)}
.page-content>*{animation:contentRise .62s both}
.page-content>*:nth-child(2){animation-delay:.07s}
.page-content>*:nth-child(3){animation-delay:.14s}
.page-content>*:nth-child(4){animation-delay:.21s}
.card{position:relative;overflow:hidden;transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease}
.card::after{content:"";position:absolute;top:-120%;left:-45%;width:32%;height:340%;transform:rotate(25deg);background:linear-gradient(90deg,transparent,rgba(0,220,255,.09),transparent);transition:left .7s ease}
.card:hover{transform:translateY(-5px);border-color:rgba(0,220,255,.48);box-shadow:0 12px 35px rgba(0,160,255,.10)}
.card:hover::after{left:125%}
.tag{transition:transform .22s ease,border-color .22s ease,background .22s ease}
.tag:hover{transform:translateY(-3px);border-color:rgba(0,220,255,.65);background:rgba(0,220,255,.13)}
.close{transition:background .25s ease,color .25s ease,transform .35s ease,box-shadow .25s ease}
.close:hover{box-shadow:0 0 20px rgba(0,220,255,.35)}
@keyframes ambientDrift{0%{transform:translate3d(-2%,0,0) rotate(0deg)}100%{transform:translate3d(3%,2%,0) rotate(7deg)}}
@keyframes heroFloat{0%{transform:scale(1)}100%{transform:scale(1.045)}}
@keyframes scanMove{0%{background-position:0 0}100%{background-position:0 180px}}
@keyframes softPulse{0%,100%{box-shadow:0 0 12px rgba(0,217,255,.18)}50%{box-shadow:0 0 25px rgba(0,217,255,.42)}}
@keyframes contentRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:700px){
 .hero img{animation-duration:30s}
 .hero::before{opacity:.13}
 .card:hover{transform:none}
}
@media(prefers-reduced-motion:reduce){
 body::before,.hero img,.hero::before,.whatsapp{animation:none!important}
 .page-content>*{animation:none!important}
 .card,.tag,.hotspot,.page,.overlay,.close{transition:none!important}
}

</style>
</head>

<script>
(() => {
 const overlay=document.getElementById('overlay');
 const content=document.getElementById('page-content');
 const closeBtn=overlay.querySelector('.close');
 let lastFocus=null;
 function openPage(name){
   const tpl=document.getElementById(name);
   if(!tpl)return;
   lastFocus=document.activeElement;
   content.replaceChildren(tpl.content.cloneNode(true));
   overlay.classList.add('open');
   overlay.setAttribute('aria-hidden','false');
   document.body.style.overflow='hidden';
   closeBtn.focus();
   history.replaceState(null,'','#'+name);
 }
 function closePage(){
   overlay.classList.remove('open');
   overlay.setAttribute('aria-hidden','true');
   document.body.style.overflow='';
   history.replaceState(null,'',location.pathname+location.search);
   if(lastFocus && lastFocus.focus)lastFocus.focus();
 }
 document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();openPage(el.dataset.page)}));
 document.querySelector('[data-home]').addEventListener('click',e=>{e.preventDefault();closePage()});
 closeBtn.addEventListener('click',closePage);
 overlay.addEventListener('click',e=>{if(e.target===overlay)closePage()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))closePage()});
})();
</script>
